name: "CI: Sync upstream release"

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: ghcr-manager/ghcr-cleanup-manager

jobs:
  sync-upstream-release:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.name }}
      target_sha: ${{ steps.stage.outputs.target_sha || steps.commit.outputs.commit_sha }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      - name: Checkout # zizmor: ignore[artipacked] this workflow must push commits and tags back to the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve target branch
        id: branch
        run: |
          echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest upstream release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_tag="$(GITHUB_REPOSITORY="${UPSTREAM_REPOSITORY}" scripts/latest-release-tag.sh)"
          upstream_sha="$(
            git ls-remote "https://github.com/${UPSTREAM_REPOSITORY}" "refs/tags/${upstream_tag}" | cut -f1
          )"
          if [[ -z "${upstream_sha}" ]]; then
            echo "Could not resolve upstream tag ${upstream_tag} to a commit SHA." >&2
            exit 1
          fi
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists here
        id: existing
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${UPSTREAM_TAG}" >/dev/null 2>&1; then
            echo "Release ${UPSTREAM_TAG} already exists in ghcr-manager/ghcr-manager."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream action metadata
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          curl \
            -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://raw.githubusercontent.com/${UPSTREAM_REPOSITORY}/${UPSTREAM_TAG}/action.yml" \
            -o /tmp/upstream-action.yml

      - name: Render wrapper action
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          OUTPUT_PATH: action.yml
          UPSTREAM_ACTION_FILE: /tmp/upstream-action.yml
          UPSTREAM_ACTION_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          UPSTREAM_ACTION_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: scripts/render-wrapper-action.sh

      - name: Show rendered action.yml
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          echo '--- action.yml ---'
          cat action.yml

      - name: lint
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: ./.github/actions/lint

      - name: Stage wrapper update
        id: stage
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No tracked file changes to commit."
            echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit wrapper update
        id: commit
        if: ${{ steps.existing.outputs.exists != 'true' && !steps.stage.outputs.target_sha }}
        uses: ./.github/actions/create-signed-commit
        with:
          branch: ${{ github.ref_name }}
          commit-message: Sync wrapper to ${{ steps.upstream.outputs.upstream_tag }}
          repository: ${{ github.repository }}

      - name: Fetch signed commit
        if: ${{ steps.existing.outputs.exists != 'true' && steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}" --depth=1

      - name: Push tags
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          TARGET_SHA: ${{ steps.stage.outputs.target_sha || steps.commit.outputs.commit_sha }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          major_tag="${UPSTREAM_TAG%%.*}"
          git tag -f "${major_tag}" "${TARGET_SHA}"
          git push origin "refs/tags/${major_tag}" --force

          if git rev-parse -q --verify "refs/tags/${UPSTREAM_TAG}" >/dev/null; then
            git tag -d "${UPSTREAM_TAG}"
          fi
          git tag "${UPSTREAM_TAG}" "${TARGET_SHA}"
          git push origin "refs/tags/${UPSTREAM_TAG}"

      - name: Create GitHub release
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          gh release create "${UPSTREAM_TAG}" \
            --verify-tag \
            --title "Release ${UPSTREAM_TAG}" \
            --generate-notes
